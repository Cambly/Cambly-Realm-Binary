name: Build RealmSwift xcframework

# Builds RealmSwift.xcframework from upstream realm-swift source against a
# specific Xcode toolchain. Use this when upstream's prebuilt slice was
# compiled against an Xcode RC and devs on the matching GA toolchain hit
# "Compiled module was created by a different version of the compiler" —
# .swiftmodule files inside an .xcframework must be byte-compatible with the
# consumer's Swift compiler build (RealmSwift is not built with library
# evolution, so even a build-number bump breaks compatibility).
#
# This workflow does NOT mirror upstream byte-for-byte. The output is a
# *Cambly-built* RealmSwift slice keyed to the chosen Xcode version. The
# accompanying `Realm.spm.zip` (Objective-C core) is unchanged across Xcode
# versions and continues to be sourced from the mirror workflow.
#
# The realm-swift source version is auto-resolved to the latest mirror
# release in this repo (tag shape vMAJOR.MINOR.PATCH, no suffix), so the
# produced slice always pairs with an already-mirrored Realm.spm.zip of
# the same upstream version. Run mirror-and-release.yml first if no such
# release exists yet. The published tag is `v<realm>-xcode<xcode>`.
#
# After running, update LocalPackages/RealmBinary/realm-binaries.json in
# Cambly-Swift with the produced URL + sha256 for the matching xcode key.

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: "Full Xcode version to build against (e.g. 26.4.1)"
        required: true
        type: string

permissions:
  contents: write  # create release + push tag

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Resolve realm-swift version and release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Source version = latest mirror release in this repo (tag shape
          # vMAJOR.MINOR.PATCH, no suffix). Anchoring to the mirror — not
          # upstream `latest` — guarantees the produced RealmSwift slice
          # pairs with an already-mirrored Realm.spm.zip of the same version.
          realm_ver=$(gh release list --repo "${{ github.repository }}" \
              --limit 50 --json tagName \
              -q '.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tagName' \
            | head -n 1 | sed 's/^v//')
          if [[ -z "$realm_ver" ]]; then
            echo "❌ No mirror release (tag shape vMAJOR.MINOR.PATCH) found in this repo."
            echo "   Run mirror-and-release.yml first to publish the upstream-mirrored"
            echo "   Realm.spm.zip + RealmSwift zips for the realm-swift version you"
            echo "   want to build against."
            exit 1
          fi
          tag="v${realm_ver}-xcode${{ inputs.xcode_version }}"
          echo "realm_ver=${realm_ver}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${tag}"   >> "$GITHUB_OUTPUT"
          echo "Building realm-swift v${realm_ver} against Xcode ${{ inputs.xcode_version }}"
          echo "Will publish under release tag: ${tag}"

      - name: Select Xcode ${{ inputs.xcode_version }}
        run: |
          set -euo pipefail
          # Prefer an exact match from the available Xcode app bundles; xcversion
          # is no longer maintained on the GHA images, so we set DEVELOPER_DIR
          # directly. Image-installed apps live under /Applications/Xcode_*.app.
          want="${{ inputs.xcode_version }}"
          candidate="/Applications/Xcode_${want}.app"
          if [[ ! -d "$candidate" ]]; then
            echo "❌ Xcode ${want} not preinstalled on this runner."
            echo "   Available:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            echo ""
            echo "   If the runner image lags Apple's release, either wait for"
            echo "   the GHA image to update, or extend this workflow to download"
            echo "   the Xcode .xip from Apple Developer (auth required)."
            exit 1
          fi
          sudo xcode-select -s "$candidate/Contents/Developer"
          xcodebuild -version
          xcrun swift --version

      - name: Clone realm/realm-swift @ v${{ steps.resolve.outputs.realm_ver }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${{ steps.resolve.outputs.realm_ver }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/realm/realm-swift.git src

      - name: Download Apple platform SDKs
        working-directory: src
        run: |
          set -euo pipefail
          # Upstream's xcframework target builds for all platforms (osx, ios,
          # watchos, tvos, catalyst, visionos). Some SDKs (visionOS, watchOS)
          # aren't preinstalled on the runner image and need to be fetched.
          # `simctl list` first to wait out any in-progress simulator setup
          # that would otherwise race with -downloadAllPlatforms.
          xcrun simctl list > /dev/null || true
          xcodebuild -downloadAllPlatforms

      - name: Build RealmSwift xcframework
        working-directory: src
        env:
          # build.sh hardcodes DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"
          # whenever GITHUB_WORKSPACE is set, but the build itself uses a relative
          # -IDECustomDerivedDataLocation=build/DerivedData and so writes to
          # $(pwd)/build/DerivedData. Upstream's CI hides this because they
          # checkout to $GITHUB_WORKSPACE directly. We clone realm-swift into
          # src/, so we have to point GITHUB_WORKSPACE at src/ for the script's
          # path math to line up with where xcodebuild actually wrote products.
          # Without this, xcodebuild -create-xcframework looks one directory too
          # high and fails with "the path does not point to a valid framework".
          GITHUB_WORKSPACE: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          # `build.sh xcframework` builds Realm + RealmSwift for all platforms
          # (default: osx ios watchos tvos catalyst visionos) with the active
          # toolchain, then runs xcodebuild -create-xcframework to combine the
          # per-platform .frameworks. Output:
          #   build/Release/Realm.xcframework
          #   build/Release/RealmSwift.xcframework
          # The .swiftmodule files inside RealmSwift report the Swift compiler
          # build of the active Xcode, which is the whole point of this rebuild.
          sh build.sh xcframework

      - name: Verify RealmSwift was built and capture compiler build
        working-directory: src
        run: |
          set -euo pipefail
          xcframework="build/Release/RealmSwift.xcframework"
          if [[ ! -d "$xcframework" ]]; then
            echo "❌ Expected $xcframework but it does not exist. Listing build/:"
            ls -laR build/ || true
            exit 1
          fi
          # Pick any .swiftmodule and dump its compiler-version string so the
          # release notes record what GA toolchain we actually built against.
          mod=$(find "$xcframework" -name "*.swiftmodule" -type f | head -n 1)
          if [[ -z "$mod" ]]; then
            echo "❌ No .swiftmodule files found inside $xcframework"
            exit 1
          fi
          echo "Sample swiftmodule: $mod"
          # Bytes 4..256-ish hold the compiler-version cstring; grep for the
          # readable prefix.
          strings "$mod" | grep -E "Apple Swift version" | head -n 3 || true

      - name: Zip RealmSwift.xcframework as RealmSwift@<xcode>.spm.zip
        working-directory: src/build/Release
        run: |
          set -euo pipefail
          # Use the Xcode major.minor as the slice key (same convention as
          # upstream and as Cambly-Swift's render_realm_wrapper.sh, which
          # extracts only major.minor from xcodebuild -version).
          XCODE_MAJ_MIN=$(awk -F. '{print $1"."$2}' <<<"${{ inputs.xcode_version }}")
          XCODE_FULL="${{ inputs.xcode_version }}"
          OUT_DIR="$RUNNER_TEMP/assets"
          mkdir -p "$OUT_DIR"

          # major.minor zip (consumed by current render_realm_wrapper.sh)
          zip -qry "$OUT_DIR/RealmSwift@${XCODE_MAJ_MIN}.spm.zip" RealmSwift.xcframework
          # major.minor.patch zip (consumed if json carries a patch-specific key)
          if [[ "$XCODE_FULL" != "$XCODE_MAJ_MIN" ]]; then
            cp "$OUT_DIR/RealmSwift@${XCODE_MAJ_MIN}.spm.zip" \
               "$OUT_DIR/RealmSwift@${XCODE_FULL}.spm.zip"
          fi
          ls -la "$OUT_DIR"

      - name: Compute sha256 checksums
        id: shas
        run: |
          set -euo pipefail
          {
            echo "checksums<<EOF"
            for f in "$RUNNER_TEMP/assets"/*.zip; do
              sha=$(shasum -a 256 "$f" | awk '{print $1}')
              name=$(basename "$f")
              printf "  %s  %s\n" "$sha" "$name"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        env:
          REALM_VER: ${{ steps.resolve.outputs.realm_ver }}
          XCODE_VER: ${{ inputs.xcode_version }}
          CHECKSUMS: ${{ steps.shas.outputs.checksums }}
        run: |
          {
            echo "body<<NOTES_EOF"
            echo "Cambly-built RealmSwift xcframework for Xcode ${XCODE_VER}, source: [realm-swift v${REALM_VER}](https://github.com/realm/realm-swift/releases/tag/v${REALM_VER})."
            echo ""
            echo "Built from upstream source against the Xcode ${XCODE_VER} GA toolchain — the .swiftmodule files inside the xcframework match the consumer's Swift compiler build, fixing the \"Compiled module was created by a different version of the compiler\" error that the upstream-prebuilt slice produces on GA toolchains."
            echo ""
            echo "**Bytes are NOT identical to upstream** (this is a rebuild, not a mirror). Pair with the upstream-mirrored \`Realm.spm.zip\` (ObjC core) from the matching upstream version — that one is unchanged across Xcode versions."
            echo ""
            echo "### Slice (sha256)"
            echo ""
            echo "<pre>"
            echo "${CHECKSUMS}"
            echo "</pre>"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.release_tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/assets"/*.zip \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/assets"/*.zip \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes "${{ steps.notes.outputs.body }}"
          fi
