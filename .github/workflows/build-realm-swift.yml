name: Build RealmSwift xcframework

# Builds RealmSwift.xcframework from upstream realm-swift source against a
# specific Xcode toolchain. Use this when upstream's prebuilt slice was
# compiled against an Xcode RC and devs on the matching GA toolchain hit
# "Compiled module was created by a different version of the compiler" —
# .swiftmodule files inside an .xcframework must be byte-compatible with the
# consumer's Swift compiler build (RealmSwift is not built with library
# evolution, so even a build-number bump breaks compatibility).
#
# This workflow does NOT mirror upstream byte-for-byte. The output is a
# *Cambly-built* RealmSwift slice keyed to the chosen Xcode version. The
# accompanying `Realm.spm.zip` (Objective-C core) is unchanged across Xcode
# versions and continues to be sourced from the mirror workflow.
#
# The realm-swift source version is auto-resolved to the latest mirror
# release in this repo (tag shape vMAJOR.MINOR.PATCH, no suffix), so the
# produced slice always pairs with an already-mirrored Realm.spm.zip of
# the same upstream version. Run mirror-and-release.yml first if no such
# release exists yet. The published tag is
# `v<realm>-xcode<xcode>${tag_suffix}` (e.g. `v20.0.4-xcode26.4.1-signed`).
#
# Output is signed with the team's Apple Distribution identity before
# zipping (ITMS-91065 requirement — App Store Connect rejects TestFlight
# submissions that bundle unsigned third-party SDKs from Apple's "commonly
# used" list, which includes Realm). Required repo secrets:
# MATCH_GIT_SSH_PRIVATE_KEY, MATCH_PASSWORD, SIGNING_IDENTITY.
#
# The Xcode version is auto-detected from the runner image's active
# toolchain — we don't ask the caller for it. The macos-26 image ships
# exactly one default Xcode (see actions/runner-images for the current
# build), and any version we'd pass in would have to match that anyway:
# .swiftmodule files do not link across Swift compiler builds, and Apple
# bumps the compiler build between point releases of the same major.minor
# (e.g. 26.4 GA ships swiftlang-6.3.0.123.5, 26.4.1 ships
# swiftlang-6.3.1.1.2). To produce a slice for a different toolchain,
# bump the runner image (or pin to a different macos-NN runner) — the
# xcframework will key off whatever Xcode that image actually has.
#
# After running, update LocalPackages/RealmBinary/realm-binaries.json in
# Cambly-Swift with the produced URL + sha256 for the matching xcode key.

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Optional suffix appended to the release tag, e.g. -signed or -r2. Used when republishing the same realm/Xcode combination (e.g. adding the Apple Distribution SDK signature). Leave empty for the first release of a given combination."
        required: false
        type: string
        default: ""

permissions:
  contents: write  # create release + push tag

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout binary repo (this)
        uses: actions/checkout@v4

      # Set up everything required for codesigning the produced xcframework
      # with the team's Apple Distribution identity. See
      # .github/actions/setup-signing for details. The composite action sets
      # MATCH_KEYCHAIN_NAME / MATCH_KEYCHAIN_PASSWORD via $GITHUB_ENV and makes
      # fastlane_tmp_keychain the runner's default keychain, so the later
      # codesign call finds the cert without further configuration.
      - name: Set up signing
        uses: ./.github/actions/setup-signing
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}
          match-password: ${{ secrets.MATCH_PASSWORD }}

      - name: Resolve realm-swift version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Source version = latest mirror release in this repo (tag shape
          # vMAJOR.MINOR.PATCH, no suffix). Anchoring to the mirror — not
          # upstream `latest` — guarantees the produced RealmSwift slice
          # pairs with an already-mirrored Realm.spm.zip of the same version.
          realm_ver=$(gh release list --repo "${{ github.repository }}" \
              --limit 50 --json tagName \
              -q '.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tagName' \
            | head -n 1 | sed 's/^v//')
          if [[ -z "$realm_ver" ]]; then
            echo "❌ No mirror release (tag shape vMAJOR.MINOR.PATCH) found in this repo."
            echo "   Run mirror-and-release.yml first to publish the upstream-mirrored"
            echo "   Realm.spm.zip + RealmSwift zips for the realm-swift version you"
            echo "   want to build against."
            exit 1
          fi
          echo "realm_ver=${realm_ver}" >> "$GITHUB_OUTPUT"
          echo "Building realm-swift v${realm_ver}"

      - name: Detect active Xcode version
        id: xcode
        run: |
          set -euo pipefail
          # Trust the runner image's active toolchain rather than asking the
          # caller for a version. xcodebuild -version is authoritative — the
          # image's /Applications/Xcode_<major.minor>.app symlinks lie about
          # the patch (e.g. Xcode_26.4.app -> Xcode_26.4.1.app), and the patch
          # is exactly what matters: Apple bumps the Swift compiler build
          # between point releases of the same major.minor. xcodebuild's
          # first line is "Xcode <version>".
          #
          # Capture the full output before parsing instead of piping through
          # `head`. xcodebuild writes via NSFileHandle which raises an
          # uncaught NSFileHandleOperationException ("Broken pipe", exit 134)
          # if the consumer closes the pipe before it's done — and `head -n 1`
          # does exactly that.
          xcode_output=$(xcodebuild -version)
          xcode_ver=$(awk 'NR==1 {print $2}' <<<"$xcode_output")
          if [[ -z "$xcode_ver" ]]; then
            echo "❌ Could not parse Xcode version from xcodebuild -version:"
            echo "$xcode_output"
            exit 1
          fi
          echo "Active Xcode: ${xcode_ver}"
          echo "$xcode_output"
          xcrun swift --version
          echo "xcode_ver=${xcode_ver}" >> "$GITHUB_OUTPUT"

      - name: Clone realm/realm-swift @ v${{ steps.resolve.outputs.realm_ver }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${{ steps.resolve.outputs.realm_ver }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/realm/realm-swift.git src

      - name: Download Apple platform SDKs
        working-directory: src
        run: |
          set -euo pipefail
          # Upstream's xcframework target builds for all platforms (osx, ios,
          # watchos, tvos, catalyst, visionos). Some SDKs (visionOS, watchOS)
          # aren't preinstalled on the runner image and need to be fetched.
          # `simctl list` first to wait out any in-progress simulator setup
          # that would otherwise race with -downloadAllPlatforms.
          xcrun simctl list > /dev/null || true
          xcodebuild -downloadAllPlatforms

      - name: Build RealmSwift xcframework
        working-directory: src
        run: |
          set -euo pipefail
          # build.sh sets DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"
          # whenever GITHUB_WORKSPACE is non-empty, but the build itself uses a
          # relative -IDECustomDerivedDataLocation=build/DerivedData and so
          # writes products to $(pwd)/build/DerivedData. Upstream's CI hides
          # this because they actions/checkout realm-swift directly into
          # $GITHUB_WORKSPACE — pwd and GITHUB_WORKSPACE end up as the same
          # path. We clone into src/, so the two paths diverge and
          # xcodebuild -create-xcframework looks one directory too high
          # ("the path does not point to a valid framework").
          #
          # Setting GITHUB_WORKSPACE via the step's env: doesn't help: GHA's
          # runner re-injects its own value for GITHUB_* vars when spawning
          # subprocesses, so xcodebuild ends up with the original path even
          # if the outer shell sees the override. `unset` at the shell level
          # propagates correctly — sub-shells don't inherit unset vars — so
          # build.sh falls into its else-branch and computes DERIVED_DATA
          # from $(pwd), which matches where xcodebuild wrote products.
          unset GITHUB_WORKSPACE

          # `build.sh xcframework` builds Realm + RealmSwift for all platforms
          # (default: osx ios watchos tvos catalyst visionos) with the active
          # toolchain, then runs xcodebuild -create-xcframework to combine the
          # per-platform .frameworks. Output:
          #   build/Release/Realm.xcframework
          #   build/Release/RealmSwift.xcframework
          sh build.sh xcframework

      - name: Verify RealmSwift was built and capture compiler build
        working-directory: src
        run: |
          set -euo pipefail
          xcframework="build/Release/RealmSwift.xcframework"
          if [[ ! -d "$xcframework" ]]; then
            echo "❌ Expected $xcframework but it does not exist. Listing build/:"
            ls -laR build/ || true
            exit 1
          fi
          # Pick any .swiftmodule and dump its compiler-version string so the
          # release notes record what GA toolchain we actually built against.
          mod=$(find "$xcframework" -name "*.swiftmodule" -type f | head -n 1)
          if [[ -z "$mod" ]]; then
            echo "❌ No .swiftmodule files found inside $xcframework"
            exit 1
          fi
          echo "Sample swiftmodule: $mod"
          # Bytes 4..256-ish hold the compiler-version cstring; grep for the
          # readable prefix.
          strings "$mod" | grep -E "Apple Swift version" | head -n 3 || true

      # Sign the .xcframework with the team's Apple Distribution identity
      # before zipping. Apple requires a signature on RealmSwift (and other
      # "commonly used third-party SDKs") under ITMS-91065 — TestFlight will
      # reject the IPA without one. Signing the bundle as a whole (Apple's
      # documented path; writes _CodeSignature/ at the bundle root + a
      # per-slice signature) lets consumers verify origin with
      # `codesign -dv RealmSwift.xcframework`.
      #
      # --force allows re-running over an already-signed bundle (workflow
      # re-runs). --timestamp embeds a secure timestamp from Apple's TSA so
      # the signature remains verifiable after the cert expires.
      - name: Sign RealmSwift.xcframework
        working-directory: src/build/Release
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY" || { echo "❌ SIGNING_IDENTITY secret is required"; exit 1; }
          echo "=== keychain state at sign time ==="
          echo "--- default keychain:"; security default-keychain || true
          echo "--- search list:"; security list-keychains -d user || true
          echo "--- codesign identities (all keychains):"; security find-identity -v -p codesigning || true
          echo "🔏 Signing RealmSwift.xcframework with: $SIGNING_IDENTITY"
          codesign --force --timestamp -vvvv --sign "$SIGNING_IDENTITY" RealmSwift.xcframework
          echo "=== verification:"
          codesign -dv RealmSwift.xcframework 2>&1 || true

      - name: Zip RealmSwift.xcframework as RealmSwift@<xcode>.spm.zip
        working-directory: src/build/Release
        run: |
          set -euo pipefail
          # Slice key is the FULL Xcode version (major.minor.patch). Apple
          # bumps the Swift compiler build between point releases of the same
          # major.minor — e.g. 26.4 GA (build 17E192) ships
          # swiftlang-6.3.0.123.5, while 26.4.1 (build 17E202) ships
          # swiftlang-6.3.1.1.2 — and .swiftmodule files do not link across
          # compiler builds. Pinning the zip name to the full version makes
          # it unambiguous which toolchain produced the slice. Don't trust
          # the GHA runner image's symlinks (e.g. macos-26 has
          # /Applications/Xcode_26.4.app symlinked to Xcode_26.4.1.app).
          OUT_DIR="$RUNNER_TEMP/assets"
          mkdir -p "$OUT_DIR"
          zip -qry "$OUT_DIR/RealmSwift@${{ steps.xcode.outputs.xcode_ver }}.spm.zip" RealmSwift.xcframework
          ls -la "$OUT_DIR"

      - name: Compute sha256 checksums
        id: shas
        run: |
          set -euo pipefail
          {
            echo "checksums<<EOF"
            for f in "$RUNNER_TEMP/assets"/*.zip; do
              sha=$(shasum -a 256 "$f" | awk '{print $1}')
              name=$(basename "$f")
              printf "  %s  %s\n" "$sha" "$name"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        env:
          REALM_VER: ${{ steps.resolve.outputs.realm_ver }}
          XCODE_VER: ${{ steps.xcode.outputs.xcode_ver }}
          CHECKSUMS: ${{ steps.shas.outputs.checksums }}
        run: |
          set -euo pipefail
          # Write the body to a file rather than $GITHUB_OUTPUT. The body
          # contains markdown backticks; if we round-trip it through
          # ${{ steps.notes.outputs.body }} into a later `gh release create
          # --notes "..."`, GHA template-substitutes first and bash then
          # parses the literal backticks as command substitution
          # (`Realm.spm.zip` → "command not found"). --notes-file reads the
          # body from disk so the bytes never traverse a shell command line.
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "Cambly-built RealmSwift xcframework for Xcode ${XCODE_VER}, source: [realm-swift v${REALM_VER}](https://github.com/realm/realm-swift/releases/tag/v${REALM_VER})."
            echo ""
            echo "Built from upstream source against the Xcode ${XCODE_VER} GA toolchain — the .swiftmodule files inside the xcframework match the consumer's Swift compiler build, fixing the \"Compiled module was created by a different version of the compiler\" error that the upstream-prebuilt slice produces on GA toolchains."
            echo ""
            echo "Signed with the team's Apple Distribution identity (\`Apple Distribution: Cambly Inc.\`) so the App Store Connect ITMS-91065 \"Missing signature\" check passes. Verify with \`codesign -dv RealmSwift.xcframework\`."
            echo ""
            echo "**Bytes are NOT identical to upstream** (this is a rebuild, not a mirror). Pair with the upstream-mirrored \`Realm.spm.zip\` (ObjC core) from the matching upstream version — that one is unchanged across Xcode versions."
            echo ""
            echo "### Slice (sha256)"
            echo ""
            echo "<pre>"
            echo "${CHECKSUMS}"
            echo "</pre>"
          } > "$notes_file"
          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.resolve.outputs.realm_ver }}-xcode${{ steps.xcode.outputs.xcode_ver }}${{ inputs.tag_suffix }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/assets"/*.zip \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/assets"/*.zip \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file "${{ steps.notes.outputs.notes_file }}"
          fi
