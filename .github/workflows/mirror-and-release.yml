name: Mirror Realm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream realm-swift version tag without v prefix (e.g. 20.0.4)"
        required: true
        type: string
      xcode_versions:
        description: "Comma-separated Xcode minor versions to mirror (e.g. 26.1,26.2,26.3,26.4). One published release per entry — these are the SLICES being mirrored, not the host Xcode."
        required: true
        default: "26.1,26.2,26.3,26.4"
        type: string
      host_xcode_version:
        description: "Xcode version selected on the runner via setup-xcode (drives codesign + CLT behavior). Pinned to avoid silent drift when GitHub bumps the macos-26 image's default Xcode. Default 26.5 is the latest GA available on macos-26; bump via scripts/upgrade-xcode.sh."
        required: true
        type: string
        default: "26.5"
      tag_suffix:
        description: "Optional suffix appended to each release tag, e.g. -signed or -r2. Used when republishing the same upstream version (e.g. adding the Apple Distribution SDK signature). Leave empty for the first release of a given upstream version."
        required: false
        type: string
        default: ""

permissions:
  contents: write  # create release + push tag

jobs:
  mirror:
    # macOS runner: we re-sign each xcframework with the team's Apple
    # Distribution identity before publishing (ITMS-91065 fix — upstream's
    # Realm.spm.zip / RealmSwift@<xcode>.spm.zip ship unsigned, and Apple now
    # rejects TestFlight submissions that bundle unsigned third-party SDKs).
    # codesign + the keychain dance both require macOS, so this can no longer
    # run on ubuntu-latest.
    runs-on: macos-26
    steps:
      - name: Checkout binary repo (this)
        uses: actions/checkout@v4

      # Pin the host Xcode so codesign + Command Line Tools behavior is
      # reproducible regardless of which Xcode the runner image's `xcode-
      # select -p` happens to point at. The mirror workflow doesn't compile
      # anything, but it does run codesign — defense-in-depth against
      # behavior changes between Xcode-bundled CLT versions. setup-xcode
      # fails loudly if the requested version isn't pre-installed.
      - name: Pin host Xcode to ${{ inputs.host_xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.host_xcode_version }}

      - name: Verify pinned Xcode
        run: |
          set -euo pipefail
          xcode_output=$(xcodebuild -version)
          actual_ver=$(awk 'NR==1 {print $2}' <<<"$xcode_output")
          expected_ver="${{ inputs.host_xcode_version }}"
          if [[ "$actual_ver" != "$expected_ver" ]]; then
            echo "❌ setup-xcode landed on Xcode $actual_ver but workflow input asked for $expected_ver."
            exit 1
          fi
          echo "$xcode_output"

      # Sets MATCH_KEYCHAIN_NAME / MATCH_KEYCHAIN_PASSWORD via $GITHUB_ENV and
      # makes fastlane_tmp_keychain the runner's default keychain, so the
      # later codesign call finds the Apple Distribution cert without any
      # further configuration. See .github/actions/setup-signing.
      - name: Set up signing
        uses: ./.github/actions/setup-signing
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}
          match-password: ${{ secrets.MATCH_PASSWORD }}

      - name: Download upstream Realm.spm.zip + per-Xcode RealmSwift zips
        env:
          UPSTREAM: "https://github.com/realm/realm-swift/releases/download/v${{ inputs.version }}"
        run: |
          set -euo pipefail
          mkdir -p downloads
          # Shared ObjC core (one zip across all Xcode versions)
          echo "⬇️  Realm.spm.zip"
          curl -L --fail --silent --show-error \
            -o downloads/Realm.spm.zip "$UPSTREAM/Realm.spm.zip"

          # Per-Xcode RealmSwift zips
          IFS=',' read -ra XCODES <<< "${{ inputs.xcode_versions }}"
          for x in "${XCODES[@]}"; do
            x_trimmed=$(echo "$x" | xargs)  # trim whitespace
            echo "⬇️  RealmSwift@${x_trimmed}.spm.zip"
            curl -L --fail --silent --show-error \
              -o "downloads/RealmSwift@${x_trimmed}.spm.zip" \
              "$UPSTREAM/RealmSwift@${x_trimmed}.spm.zip"
          done

          echo ""
          echo "Downloaded:"
          ls -la downloads/

      - name: Verify each download is non-empty
        run: |
          set -euo pipefail
          for f in downloads/*.zip; do
            size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")
            if [[ "$size" -lt 1000000 ]]; then  # < 1MB is suspicious
              echo "❌ $f looks too small: $size bytes"
              exit 1
            fi
            echo "✓ $f ($((size/1024/1024)) MB)"
          done

      # Re-sign each .xcframework with the team's Apple Distribution identity
      # before re-zipping. Upstream's realm-swift releases ship unsigned, but
      # Apple's ITMS-91065 check now rejects TestFlight submissions that
      # bundle unsigned third-party SDKs from the "commonly used" list (Realm
      # is on that list — caught Lexicon 1.2.7 on 2026-05-27, MOB-290).
      #
      # We unzip → codesign → re-zip with the same asset name so consumers
      # of `realm-binaries.json` only have to swap the URL/sha, not the
      # filename. --force allows re-running over an already-signed bundle
      # (workflow re-runs). --timestamp embeds Apple's TSA timestamp so the
      # signature remains verifiable after the cert expires.
      - name: Sign each xcframework and re-zip
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY" || { echo "❌ SIGNING_IDENTITY secret is required"; exit 1; }
          echo "=== keychain state at sign time ==="
          echo "--- default keychain:"; security default-keychain || true
          echo "--- search list:"; security list-keychains -d user || true
          echo "--- codesign identities (all keychains):"; security find-identity -v -p codesigning || true

          mkdir -p assets
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for zip in downloads/*.zip; do
            name=$(basename "$zip")
            echo ""
            echo "🔏 Signing $name"
            stage="$work/$name.unpack"
            rm -rf "$stage" && mkdir -p "$stage"
            unzip -q "$zip" -d "$stage"
            # Each .spm.zip contains exactly one *.xcframework bundle at the
            # archive root. Be explicit about that — fail loudly if upstream's
            # shape ever changes.
            xcframework=$(find "$stage" -maxdepth 2 -type d -name "*.xcframework" -print -quit)
            if [[ -z "$xcframework" ]]; then
              echo "❌ No *.xcframework found inside $name"; ls -la "$stage"; exit 1
            fi
            codesign --force --timestamp -vvvv --sign "$SIGNING_IDENTITY" "$xcframework"
            codesign -dv "$xcframework" 2>&1 || true

            # Re-zip with the same asset name so consumers swap URL+sha only.
            ( cd "$(dirname "$xcframework")" && zip -qry "$GITHUB_WORKSPACE/assets/$name" "$(basename "$xcframework")" )
            echo "✓ Re-zipped $name ($(stat -f%z "assets/$name" 2>/dev/null || stat -c%s "assets/$name") bytes)"
          done

          echo ""
          echo "Signed assets:"
          ls -la assets/

      # Publish ONE release per (realm-version, xcode-version) pair instead
      # of an omnibus `v<version>` release that bundles every slice together.
      # Per-Xcode-version tags let consumers pin to a single slice and let
      # us re-roll one Xcode toolchain without re-versioning the others.
      # Tag pattern matches build-realm-swift.yml so all RealmSwift releases
      # share one convention:
      #
      #   v<realm>${tag_suffix}                — Realm.spm.zip (ObjC core,
      #                                          no Xcode key — same across
      #                                          all Xcode versions)
      #   v<realm>-xcode<minor>${tag_suffix}   — RealmSwift@<minor>.spm.zip
      #                                          (mirror, upstream-built)
      #   v<realm>-xcode<minor>.<patch>${tag_suffix}
      #                                        — RealmSwift@<minor>.<patch>.spm.zip
      #                                          (Cambly-built; produced by
      #                                          build-realm-swift.yml)
      - name: Publish per-Xcode-version GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          set -euo pipefail

          publish_release() {
            local tag="$1"
            local asset="$2"
            local title="$3"
            local notes_file="$4"

            echo ""
            echo "▶▶▶ Publishing $tag with $asset"
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$tag" "$asset" \
                --repo "${{ github.repository }}" --clobber
            else
              gh release create "$tag" "$asset" \
                --repo "${{ github.repository }}" \
                --title "$title" \
                --notes-file "$notes_file"
            fi
          }

          sha_of() {
            shasum -a 256 "$1" | awk '{print $1}'
          }

          # ── Realm.spm.zip (ObjC core) ──────────────────────────────────────
          objc_tag="v${VERSION}${TAG_SUFFIX}"
          objc_asset="assets/Realm.spm.zip"
          objc_sha=$(sha_of "$objc_asset")
          objc_notes="$RUNNER_TEMP/notes-objc.md"
          {
            echo "Cambly-distributed mirror of upstream [realm-swift v${VERSION}](https://github.com/realm/realm-swift/releases/tag/v${VERSION}) Objective-C core, re-signed with the team's Apple Distribution identity (\`Apple Distribution: Cambly Inc.\`) so App Store Connect's ITMS-91065 \"Missing signature\" check passes. Verify with \`codesign -dv Realm.xcframework\`."
            echo ""
            echo "ObjC core has no Xcode version dependency — pair with any \`v${VERSION}-xcode<minor>${TAG_SUFFIX}\` release for the Swift slice."
            echo ""
            echo "### Slice (sha256)"
            echo ""
            echo "<pre>"
            printf "  %s  %s\n" "$objc_sha" "Realm.spm.zip"
            echo "</pre>"
          } > "$objc_notes"
          publish_release "$objc_tag" "$objc_asset" "$objc_tag" "$objc_notes"

          # ── RealmSwift@<minor>.spm.zip per Xcode version ──────────────────
          IFS=',' read -ra XCODES <<< "${{ inputs.xcode_versions }}"
          for x in "${XCODES[@]}"; do
            x_trimmed=$(echo "$x" | xargs)
            swift_tag="v${VERSION}-xcode${x_trimmed}${TAG_SUFFIX}"
            swift_asset="assets/RealmSwift@${x_trimmed}.spm.zip"
            swift_sha=$(sha_of "$swift_asset")
            swift_notes="$RUNNER_TEMP/notes-xcode${x_trimmed}.md"
            {
              echo "Cambly-distributed mirror of upstream [realm-swift v${VERSION}](https://github.com/realm/realm-swift/releases/tag/v${VERSION}) RealmSwift slice for Xcode ${x_trimmed}, re-signed with the team's Apple Distribution identity (\`Apple Distribution: Cambly Inc.\`) so App Store Connect's ITMS-91065 \"Missing signature\" check passes. Verify with \`codesign -dv RealmSwift.xcframework\`."
              echo ""
              echo "Built by upstream's CI against the Xcode ${x_trimmed} RC toolchain — if you're on a different GA toolchain and hit \"Compiled module was created by a different version of the compiler\", use the Cambly-built slice from \`v${VERSION}-xcode${x_trimmed}.<patch>${TAG_SUFFIX}\` instead (produced by build-realm-swift.yml)."
              echo ""
              echo "Pair with the ObjC core from \`v${VERSION}${TAG_SUFFIX}/Realm.spm.zip\`."
              echo ""
              echo "### Slice (sha256)"
              echo ""
              echo "<pre>"
              printf "  %s  %s\n" "$swift_sha" "RealmSwift@${x_trimmed}.spm.zip"
              echo "</pre>"
            } > "$swift_notes"
            publish_release "$swift_tag" "$swift_asset" "$swift_tag" "$swift_notes"
          done

          echo ""
          echo "✓ Published ObjC core + ${#XCODES[@]} per-Xcode-version Swift releases"
